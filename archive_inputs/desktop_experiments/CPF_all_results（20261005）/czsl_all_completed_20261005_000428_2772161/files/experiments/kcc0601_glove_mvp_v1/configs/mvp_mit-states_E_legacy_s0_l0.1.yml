DATASET:
  name: mit-states
  root_dir: /data/xhw/czsl_repro/data/mit-states
  splitname: compositional-split-natural
EVAL:
  open_world: false
  topk: 1
MODEL:
  attn_normalized: true
  classifier: cosine
  cosine_cls_temp: 0.05
  emb_dim: 300
  img_emb_dim: 768
  img_emb_drop: 0.35
  kcc_beta: 0.0
  kcc_cache: /data/xhw/czsl_repro/knowledge/kcc0601_v1/cache_trusted_v1/mit-states
  kcc_calib: true
  kcc_control: none
  kcc_feature: false
  kcc_lambda: 0.1
  kcc_logic: false
  kcc_score_mode: legacy
  kcc_text: true
  lambda_attn: 10.0
  load_checkpoint: None
  name: OADIS
  optim_weights: null
  use_attr_loss: true
  use_composed_pair_loss: true
  use_emb_pair_loss: true
  use_obj_loss: true
  weights: null
  wordemb_compose: obj-conditioned-cgqa
  wordemb_compose_dropout: 0.2
  wordembs: glove
TRAIN:
  aug_epoch: 37
  batch_size: 64
  checkpoint_dir: /data/xhw/czsl_repro/experiments/kcc0601_glove_mvp_v1/runs/mvp_mit-states_E_legacy_s0_l0.1/checkpoints
  comb_features: false
  decay_factor: 0.1
  decay_strategy: milestone
  disp_interval: 283
  eval_every_epoch: 1
  final_max_epoch: 10
  finetune_backbone: true
  kcc_run_dir: /data/xhw/czsl_repro/experiments/kcc0601_glove_mvp_v1/runs/mvp_mit-states_E_legacy_s0_l0.1
  kcc_stage: mvp
  kcc_test_at_end: false
  kcc_variant: E
  log_dir: /data/xhw/czsl_repro/experiments/kcc0601_glove_mvp_v1/runs/mvp_mit-states_E_legacy_s0_l0.1/logs
  lr: 0.0001
  lr_decay_milestones:
  - 23
  - 30
  lr_encoder: 1.0e-05
  lr_word_embedding: 2.5e-06
  max_epoch: 10
  num_workers: 4
  save_every_epoch: 1
  seed: 0
  start_epoch: 1
  start_epoch_validate: 1
  test_batch_size: 64
  train_name: mvp_mit-states_E_legacy_s0_l0.1
  use_precomputed_features: false
  wd: 5.0e-05
config_name: mit-states-czsl
