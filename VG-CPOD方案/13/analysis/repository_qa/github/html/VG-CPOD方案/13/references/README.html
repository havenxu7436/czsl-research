<p dir="auto">本轮归入VG-CPOD第13实验，使用<a href="/havenxu7436/czsl-research/blob/f16c6aa7ae2273cdb02043e77f773ffaa08001de/VG-CPOD%E6%96%B9%E6%A1%88/08/README.md">08/G0</a>的静态CP与三个最优初始化，承接<a href="/havenxu7436/czsl-research/blob/f16c6aa7ae2273cdb02043e77f773ffaa08001de/VG-CPOD%E6%96%B9%E6%A1%88/12/README.md">12/K组</a>之后对条件属性判别的研究。最初部署名称保留在原始ZIP、日志和预测中，以维持科学记录的字节身份；当前方案、执行包与索引采用L组身份。</p>
<p dir="auto"><a href="/havenxu7436/czsl-research/blob/f16c6aa7ae2273cdb02043e77f773ffaa08001de/VG-CPOD%E6%96%B9%E6%A1%88/13/%E6%9D%A5%E6%BA%90%E4%B8%8E%E8%AE%B8%E5%8F%AF.md">来源与许可</a> · <a href="/havenxu7436/czsl-research/blob/f16c6aa7ae2273cdb02043e77f773ffaa08001de/VG-CPOD%E6%96%B9%E6%A1%88/13/configs/vgcpod_v1_roundL/assets/provenance.json">初始权重来源和哈希</a> · <a href="/havenxu7436/czsl-research/blob/f16c6aa7ae2273cdb02043e77f773ffaa08001de/VG-CPOD%E6%96%B9%E6%A1%88/13/references/original_reports/complete_analysis_20261023.md.txt">原始完整分析报告</a> · <a href="/havenxu7436/czsl-research/blob/f16c6aa7ae2273cdb02043e77f773ffaa08001de/VG-CPOD%E6%96%B9%E6%A1%88/13/references/original_repository_documents">迁移前阅读文档</a></p>
<p dir="auto">此前TRUST v1结果曾形成后续条件知识提案，原文现存<a href="/havenxu7436/czsl-research/blob/f16c6aa7ae2273cdb02043e77f773ffaa08001de/VG-CPOD%E6%96%B9%E6%A1%88/13/references/prior_analysis_proposal.md.txt">prior_analysis_proposal.md.txt</a>。最终执行冻结Au/Av并降低已有条件头续训学习率，以<a href="/havenxu7436/czsl-research/blob/f16c6aa7ae2273cdb02043e77f773ffaa08001de/VG-CPOD%E6%96%B9%E6%A1%88/13/REVISED_PLAN.md">修订方案</a>与<a href="/havenxu7436/czsl-research/blob/f16c6aa7ae2273cdb02043e77f773ffaa08001de/VG-CPOD%E6%96%B9%E6%A1%88/13/code/README.md">代码</a>为准。下一步视觉比较仅为<a href="/havenxu7436/czsl-research/blob/f16c6aa7ae2273cdb02043e77f773ffaa08001de/VG-CPOD%E6%96%B9%E6%A1%88/13/NEXT_DIRECTION.md">拟议研究方向</a>，没有混入本轮训练。</p>
